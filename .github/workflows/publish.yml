name: npm publication

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Approved release tag on main (vX.Y.Z)
        required: true
        type: string
      dist_tag:
        description: npm distribution tag (prereleases must use next)
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global npm@11.15.0
      - name: Require an approved release merge and exact-source CI
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DIST_TAG: ${{ inputs.dist_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          # Keep OIDC provenance tied to the same source as this workflow run.
          test "$sha" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --paginate --slurp > "$RUNNER_TEMP/release-prs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=100" > "$RUNNER_TEMP/release-ci.json"
          export RELEASE_SHA="$sha"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const prs = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-prs.json`, 'utf8')).flat();
          assert.ok(prs.some(pr => pr.merged_at && pr.merge_commit_sha === process.env.RELEASE_SHA && pr.base.ref === 'main' && pr.head.repo?.full_name === process.env.GITHUB_REPOSITORY && /^(release|hotfix)\//.test(pr.head.ref)), 'Tag must identify a merged release/hotfix PR into main');
          const { workflow_runs: runs } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-ci.json`, 'utf8'));
          const latest = runs.filter(run => run.head_branch === 'main' && run.head_sha === process.env.RELEASE_SHA).sort((a, b) => b.id - a.id)[0];
          assert.ok(latest?.status === 'completed' && latest.conclusion === 'success', 'Latest main CI for the exact release source must pass, including real surfaces');
          NODE
          git checkout --detach "$sha"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@mattschramm/spyglass');
          assert.equal(`v${pkg.version}`, process.env.RELEASE_TAG, 'Tag/version mismatch');
          assert.notEqual(pkg.private, true);
          assert.equal(pkg.publishConfig?.access, 'public');
          assert.equal(pkg.publishConfig?.registry, 'https://registry.npmjs.org/');
          assert.ok(!pkg.version.includes('-') || process.env.DIST_TAG !== 'latest', 'Prereleases cannot move latest');
          const response = await fetch(`https://registry.npmjs.org/@mattschramm%2fspyglass/${encodeURIComponent(pkg.version)}`);
          assert.equal(response.status, 404, 'Version exists or registry could not confirm absence; refusing staging');
          NODE
      - run: npm ci
      - name: Pack once and verify the exact archive
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/package/manifest.json"
          archive=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/package/manifest.json'))[0].filename")
          node scripts/check-package.mjs "$RUNNER_TEMP/package/$archive" "$RUNNER_TEMP/package/proof"
          echo "integrity=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/package/manifest.json'))[0].integrity")" >> "$GITHUB_OUTPUT"
          # Confirm the pinned CLI accepts this archive without making a registry write.
          npm stage publish "$RUNNER_TEMP/package/$archive" --dry-run --ignore-scripts --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
      - name: Retain archive, manifest and installed-command proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 14

  stage:
    name: Stage checked archive on npm
    needs: prepare
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Verify archive integrity and stage without rebuilding
        env:
          EXPECTED_INTEGRITY: ${{ needs.prepare.outputs.integrity }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { basename } from 'node:path';
          const [manifest] = JSON.parse(readFileSync('candidate/manifest.json', 'utf8'));
          assert.equal(basename(manifest.filename), manifest.filename);
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync(`candidate/${manifest.filename}`)).digest('base64');
          assert.equal(integrity, process.env.EXPECTED_INTEGRITY);
          assert.equal(integrity, manifest.integrity);
          NODE
          archive=$(node -p "JSON.parse(require('fs').readFileSync('candidate/manifest.json'))[0].filename")
          npm stage publish "candidate/$archive" --ignore-scripts --access public --tag "$DIST_TAG"
          echo 'Candidate staged. Review the retained archive and proof, then approve on npm with 2FA. This workflow does not approve it.' >> "$GITHUB_STEP_SUMMARY"
