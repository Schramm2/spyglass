name: Bug report
description: Report a command that does not do what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies or private application data.
        To report a security vulnerability, use SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, its `--json` output and its exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal profile and the commands, if you can share them.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `spyglass --version`, `node --version` and your OS.
    validations:
      required: true
